<body class="">
<x-dc><helmet><style>
:root{
  --paper:#F7F3EC; --paper2:#EFE8DA; --card:#FFFDF8; --line:#D8CFBE;
  --ink:#141414; --ink2:#38342F; --mute:#655F56;
  --acc:#FF5A2B; --acc-ink:#BF3A12; --ind:#1F3A6E;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STZhongsong","STSong","SimSun",serif;
  --num:"Didot","Bodoni 72","Bodoni MT","Times New Roman","Songti SC",serif;
  --gut:clamp(22px,5.5vw,88px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
body::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.55;background-image:url("/_blob/c5e3b8e3dbb9a6e7c0c4189ed6bd4ee6")}
h1,p{margin:0}
::selection{background:var(--acc);color:var(--ink)}
.cv{position:relative;width:100%;height:100vh;min-height:640px;padding:clamp(34px,4.8vh,58px) var(--gut) clamp(24px,3.6vh,40px);display:flex;flex-direction:column;overflow:hidden}
.cv-top{position:relative;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.cv-mark{display:block;width:22px;height:30px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.cv-main{position:relative;z-index:2;width:100%;max-width:1424px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:clamp(30px,5vh,60px)}
.cv-title{font-family:var(--serif);font-weight:900;font-size:clamp(84px,10.4vw,160px);line-height:.94;letter-spacing:-.045em;white-space:nowrap;display:flex;align-items:baseline;justify-content:center;gap:clamp(14px,1.8vw,28px);animation:cvIn 1s var(--ease) both}
.cv-title-main{display:inline-block}
.cv-edition{display:inline-flex;align-items:center;gap:clamp(10px,1.2vw,16px);font-family:var(--serif);font-size:clamp(26px,2.75vw,44px);font-weight:700;line-height:1;letter-spacing:.1em;color:var(--ink2);white-space:nowrap}
.cv-edition .cv-bar{width:5px;height:clamp(26px,2.8vw,44px);background:var(--acc)}
.cv-rule{display:block;width:72%;height:2px;background:var(--ink);transform-origin:50% 50%;margin:clamp(28px,4.2vh,48px) auto clamp(24px,3.8vh,40px);animation:cvRule .9s var(--ease) .18s both}
.cv-lower{display:block;animation:cvRise .8s var(--ease) .38s both}
.cv-author{display:flex;align-items:center;margin-top:clamp(20px,3.1vh,32px);font-size:clamp(13px,1.05vw,16px);font-weight:700;letter-spacing:.1em;color:var(--ink2)}
.cv-author .by{margin-right:9px;font-size:.82em;letter-spacing:.18em;color:var(--mute)}
.cv-sub-t{font-family:var(--serif);font-weight:800;font-size:clamp(34px,3.6vw,58px);line-height:1.12;letter-spacing:-.02em}
.cv-sub-s{margin-top:12px;font-size:clamp(14px,1.08vw,17px);font-weight:600;letter-spacing:.1em;line-height:1.6;color:var(--mute)}
.cv-foot{position:relative;z-index:3;display:flex;align-items:center;justify-content:flex-start;gap:20px;border-top:1.5px solid var(--line);padding-top:13px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute);animation:cvFade .8s var(--ease) .62s both}
.cv-src{display:flex;align-items:center;gap:12px;white-space:nowrap}
.cv-src i{display:block;width:clamp(190px,22vw,320px);height:1.5px;background:var(--line);transform:translateY(2px)}
.cv-big{position:absolute;right:clamp(18px,3.2vw,52px);bottom:clamp(52px,8vh,94px);z-index:1;font-family:var(--num);font-weight:900;font-size:clamp(190px,24vw,360px);line-height:.64;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:1.5px rgba(20,20,20,.09);pointer-events:none;animation:cvFade 1.2s var(--ease) .45s both}
@keyframes cvIn{from{clip-path:inset(0 0 108% 0);transform:translateY(22px)}to{clip-path:inset(-12% -4% -18% -4%);transform:none}}
@keyframes cvRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cvRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cvFade{from{opacity:0}to{opacity:1}}
@media (max-width:900px){
  .cv{min-height:0;padding:28px 22px 22px}
  .cv-title{flex-wrap:wrap;white-space:normal;font-size:clamp(56px,17vw,96px);line-height:1.02;gap:8px 14px}
  .cv-edition{font-size:clamp(22px,6.2vw,34px)}
  .cv-lower{display:block}
  .cv-author{margin-top:18px}
  .cv-src i{width:150px}
  .cv-sub-t{font-size:clamp(28px,8vw,40px)}
  .cv-big{font-size:150px;right:12px;bottom:50px;opacity:.8}
  .cv-foot{font-size:10.5px}
}
@media print{.cv{height:auto;min-height:0}}
</style></helmet>
<div class="cv">
  <header class="cv-top">
    <i class="cv-mark" aria-hidden="true"></i>
    
  </header>
  <main class="cv-main">
    <h1 class="cv-title" aria-label="AI起飞心法 入门篇" style="text-align: center"><span class="cv-title-main">AI起飞心法</span><span class="cv-edition"><i class="cv-bar" aria-hidden="true"></i>入门篇</span></h1>
    <i class="cv-rule" aria-hidden="true"></i>
    <div class="cv-lower">
      <div class="cv-sub">
        
        
      </div>
      
    </div>
  </main>
  <footer class="cv-foot"><span class="cv-src">作者：自如老师&nbsp; 开源地址<i aria-hidden="true"></i></span></footer>
  <span class="cv-big" aria-hidden="true">10</span>
</div>
